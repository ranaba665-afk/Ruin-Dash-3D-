<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>RUN for EARN</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      color: #555555;
      font-family: "Courier New", Courier, monospace;
      text-align: center;
    }

    main {
      width: 100%;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transform: translateY(2px);
    }

    .brand {
      margin: 0 0 14px;
      font-size: clamp(25px, 7vw, 36px);
      line-height: 1.25;
      font-weight: 400;
      letter-spacing: 1px;
    }

    .message {
      max-width: 620px;
      margin: 0 0 42px;
      font-size: clamp(23px, 6.5vw, 36px);
      line-height: 1.12;
      font-weight: 400;
    }

    .telegram-button {
      width: min(100%, 526px);
      min-height: 126px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 14px;
      border: 3px solid #222222;
      border-radius: 13px;
      background: #aaaaaa;
      color: #555555;
      text-decoration: none;
      font: inherit;
      font-size: clamp(25px, 7vw, 39px);
      letter-spacing: clamp(4px, 1.2vw, 8px);
      line-height: 1.2;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 120ms ease, transform 120ms ease;
    }

    .telegram-button:active {
      background: #999999;
      transform: scale(0.99);
    }

    .telegram-button:focus-visible {
      outline: 3px solid #555555;
      outline-offset: 4px;
    }

    @media (max-width: 360px) {
      .telegram-button {
        min-height: 105px;
        letter-spacing: 3px;
        font-size: 23px;
      }

      .message {
        margin-bottom: 34px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="brand">RUN for EARN</h1>
    <p class="message">Please open this game inside Telegram.</p>
    <a
      class="telegram-button"
      href="https://t.me/run_for_earn_bot"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Open RUN for EARN in Telegram"
    >OPEN TELEGRAM</a>
  </main>
</body>
</html>
